<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compose email</title>
  <link rel="stylesheet" href="/runtime/runtime.css">
  <link rel="stylesheet" href="/assets/form-email/form.css">
  <script type="module" src="/assets/form-email/form.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">Email</span><div class="header-actions"><button type="button" data-info aria-label="about this form" title="about this form" aria-expanded="false" aria-controls="form-info"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg></button><button type="button" form="entry-form" data-action="save_draft" title="save draft" aria-label="save draft" disabled><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h9"/></svg></button><a data-new href="/new/form-email" title="create new form" aria-label="create new form"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a></div></header>
    <aside id="form-info" data-info-panel aria-label="About this form" hidden><p>Compose an email with recipients, a subject, and a formatted message. Use the save icon to save a draft locally. Submission prepares the email for an agent or tool to send; this form does not send email.</p></aside>
    <p class="session-label"><code data-session>…</code></p>
    <form id="entry-form" novalidate>
      <fieldset data-fields disabled>
        <label for="to">To <span class="required-marker" aria-hidden="true">*</span></label>
        <input id="to" name="to" type="text" inputmode="email" autocomplete="email" placeholder="recipient@example.com" maxlength="2000" aria-describedby="recipient-hint" required>
        <p id="recipient-hint" class="hint">Separate multiple email addresses with commas.</p>
        <label for="subject">Subject <span class="required-marker" aria-hidden="true">*</span></label>
        <input id="subject" name="subject" placeholder="Add a subject" maxlength="998" required>
        <label id="body-label">Message <span class="required-marker" aria-hidden="true">*</span></label>
        <div class="editor-shell">
          <div class="toolbar" role="group" aria-label="Message formatting">
            <button type="button" data-command="bold" aria-label="Bold" title="Bold"><b>B</b></button>
            <button type="button" data-command="italic" aria-label="Italic" title="Italic"><i>I</i></button>
            <button type="button" data-command="underline" aria-label="Underline" title="Underline"><u>U</u></button>
            <button type="button" data-command="insertUnorderedList" title="Bullet list">• List</button>
            <button type="button" data-command="insertOrderedList" title="Numbered list">1. List</button>
            <button type="button" data-command="removeFormat" title="Clear formatting">Clear</button>
          </div>
          <div id="body" contenteditable="false" role="textbox" aria-multiline="true" aria-required="true" aria-labelledby="body-label" tabindex="0" spellcheck="true"></div>
        </div>
        <div class="actions">
            <button type="submit" data-action="submit">Submit</button>
        </div>
      </fieldset>
    </form>
    <p data-status role="status" aria-live="polite">Opening your session…</p>
    <button data-retry type="button" hidden>Retry save</button>
  </main>
</body>
</html>
